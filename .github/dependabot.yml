version: 2
updates:
  # Deprecated package: monthly cadence keeps the security baseline without
  # weekly churn.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on TypeScript 6 until TS 7.1 is supported by typescript-eslint,
      # vue-tsc and vite-plugin-dts.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
